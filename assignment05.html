         #b{

</head>
<body>
    <h1>Books List From Array</h1>
    <div id="a">
    <lable for=""details">Add New Book:-</lable>
    <input type="text" id="details"></div> <br><br>
    <div id="b"> <input type="button" value="Add New Book" onclick="newbook()" id="n_book"> </div><br><br>
    <div id="list"></div>
    <script>
        const books = ["Harry Potter", "The Alchemist","Atomic Habits", "Clean Code", "Web Dev", "Linux"];
        function book_details(){

        let list1 = "<table>";
        list1+=`<tr>
                    <th> S.No </th>
                    <th>Book Name</th>
                </tr>`;
            for(let i=0;i<books.length;i++){
                list1+= "<tr> <td>"+(i+1)+"</td><td>"+books[i]+"</td></tr>"
            }    
            list1+="</table>"
            document.getElementById("list").innerHTML=list1;
        }
        book_details();
        function newbook(){
            let h = document.getElementById("details").value;
            if(h!="")
        {
            books.push(h);
            book_details();
            document.getElementById("details").value="";
        }
        else{
            alert("please enter the book name");
        }
        }
    </script>
</body>
